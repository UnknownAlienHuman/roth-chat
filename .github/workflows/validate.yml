name: Validate RothChat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Parse all Lua files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)

      - name: Verify chat filter contract
        run: lua5.4 tests/core_chat_filter_spec.lua

      - name: Verify module lifecycle contract
        run: lua5.4 tests/core_module_lifecycle_spec.lua

      - name: Verify URL transformation contract
        run: lua5.4 tests/url_copy_spec.lua

      - name: Verify Cleaner localization contract
        run: lua5.4 tests/cleaner_spec.lua

      - name: Verify TOC metadata and load paths
        run: |
          grep -Fxq '## Interface: 120100' RothChat.toc
          grep -Fxq '## Author: Neomorph' RothChat.toc
          grep -Fxq '## Version: 1.1.1' RothChat.toc
          python3 - <<'PY'
          from pathlib import Path

          missing = []
          for raw_line in Path("RothChat.toc").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              path = line.split(" --", 1)[0].strip().replace("\\", "/")
              if not Path(path).is_file():
                  missing.append(path)

          if missing:
              raise SystemExit("Missing TOC paths: " + ", ".join(missing))
          PY
