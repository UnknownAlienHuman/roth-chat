name: Lua syntax

on:
  push:
    branches:
      - main
      - "update/**"
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse addon Lua files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.lua' -not -path './ThirdParty/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo 'No addon Lua files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            luac5.1 -p "${file}"
          done
