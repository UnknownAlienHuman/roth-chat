name: Validate RothChat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4

      - name: Parse all Lua files with Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          for compiler in luac5.1 luac5.4; do
            while IFS= read -r -d '' file; do
              "$compiler" -p "$file"
            done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          done

      - name: Run contract suite with Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/core_chat_filter_spec.lua
            tests/core_module_lifecycle_spec.lua
            tests/core_dispatch_mutation_spec.lua
            tests/platform_spec.lua
            tests/chat_lifecycle_spec.lua
            tests/chat_text_spec.lua
            tests/timestamps_spec.lua
            tests/url_copy_spec.lua
            tests/cleaner_spec.lua
            tests/restore_spec.lua
            tests/ticker_spec.lua
            tests/dock_spec.lua
            tests/resize_spec.lua
          )

          for runtime in lua5.1 lua5.4; do
            for test_file in "${tests[@]}"; do
              if [[ "$runtime" == "lua5.1" ]]; then
                "$runtime" -e 'table.unpack = unpack' "$test_file"
              else
                "$runtime" "$test_file"
              fi
            done
          done

      - name: Verify TOC metadata and load paths
        run: |
          grep -Fxq '## Interface: 120100' RothChat.toc
          grep -Fxq '## Author: Neomorph' RothChat.toc
          grep -Fxq '## Version: 1.1.1' RothChat.toc
          python3 - <<'PY'
          from pathlib import Path

          missing = []
          for raw_line in Path("RothChat.toc").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              path = line.split(" --", 1)[0].strip().replace("\\", "/")
              if not Path(path).is_file():
                  missing.append(path)

          if missing:
              raise SystemExit("Missing TOC paths: " + ", ".join(missing))
          PY
