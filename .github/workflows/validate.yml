name: Validate RothChat

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rothchat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4

      - name: Validate metadata, load ownership, syntax and every contract
        run: python3 scripts/validate.py --lua lua5.1 --lua lua5.4

      - name: Build and compare deterministic install archives
        run: |
          python3 scripts/package.py /tmp/RothChat-a.zip
          python3 scripts/package.py /tmp/RothChat-b.zip
          cmp /tmp/RothChat-a.zip /tmp/RothChat-b.zip
          python3 scripts/package.py --verify /tmp/RothChat-a.zip
